name: Check navigation in Chrome
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-navigation.yml'
      - 'scripts/check-navigation.mjs'
      - 'public/index.html'
      - 'public/styles.css'
permissions:
  contents: read
jobs:
  header-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned browser driver
        run: npm install --no-save --package-lock=false playwright@1.63.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Click navigation on desktop and mobile Chrome
        run: node scripts/check-navigation.mjs
