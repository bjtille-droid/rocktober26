name: Check navigation in Chrome
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-navigation.yml'
      - 'scripts/check-navigation.mjs'
      - 'scripts/check-guest-journey.mjs'
      - 'public/index.html'
      - 'public/arcade.html'
      - 'public/roll-call.html'
      - 'public/styles.css'
      - 'public/community.js'
      - 'public/party.js'
      - 'public/game.js'
      - 'public/rocktober.ics'
      - 'public/assets/instagram.svg'
      - 'public/assets/bat-flight.svg'
      - 'server.mjs'
permissions:
  contents: read
jobs:
  header-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned browser driver
        run: npm install --no-save --package-lock=false playwright@1.63.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Click navigation on desktop and mobile Chrome
        run: node scripts/check-navigation.mjs
      - name: Exercise the local two-visitor guest journey
        run: node scripts/check-guest-journey.mjs
      - name: Inspect the public website without writes
        if: github.event_name != 'pull_request'
        # Recheck the published Instagram and Google Calendar update after rollout.
        run: node scripts/check-guest-journey.mjs --live
        env:
          LIVE_SITE: https://rocktober-dun.vercel.app
